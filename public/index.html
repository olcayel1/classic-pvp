<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Classic PvP</title>
<style>
*{box-sizing:border-box;touch-action:none}
body{margin:0;background:#111;color:white;font-family:Arial;overflow:hidden}
canvas{display:block}
#login{position:fixed;inset:0;background:#18251e;display:flex;align-items:center;justify-content:center;z-index:10}
.panel{width:85%;max-width:340px;background:#302d26;padding:25px;border:2px solid #b89b56;border-radius:10px;text-align:center}
input,select,button{padding:12px;margin:5px;border:1px solid #b89b56;border-radius:6px;background:#302d26;color:white;font-size:16px}
.panel input,.panel select,.panel button{width:95%}
#hud{position:fixed;top:12px;left:12px;background:#0009;padding:10px;border-radius:8px;min-width:160px;pointer-events:none}
.bar{width:150px;height:12px;background:#333;margin:5px 0}
#hp{height:100%;background:#c52c2c}
#mp{height:100%;background:#287bd1}
#pad{position:fixed;bottom:25px;left:15px;display:grid;grid-template-columns:repeat(3,52px)}
#pad button{height:52px;margin:2px;background:#222b}
#actions{position:fixed;bottom:25px;right:12px;display:flex;flex-direction:column}
#actions button{height:58px;background:#382d1ddd}
#status{position:fixed;top:12px;right:12px;background:#0009;padding:8px}
</style>
</head>
<body>
<div id="login">
<div class="panel">
<h1>CLASSIC PvP</h1>
<p>65 Level PK Arena</p>
<input id="nick" placeholder="Karakter adi" maxlength="18">
<select id="team">
<option>Human</option>
<option>Orc</option>
</select>
<select id="cls">
<option>Warrior</option>
<option>Rogue</option>
<option>Mage</option>
<option>Priest</option>
</select>
<button id="join">OYUNA GIR</button>
<p id="message">Sunucuya baglaniliyor...</p>
</div>
</div>

<div id="hud">
<div id="info">Lv.65</div>
<div class="bar"><div id="hp"></div></div>
<div class="bar"><div id="mp"></div></div>
<div id="np">NP: 0</div>
<div id="target">Hedef: Yok</div>
</div>
<div id="status">Online: 0</div>

<div id="pad">
<span></span><button data-dir="0,-1">▲</button><span></span>
<button data-dir="-1,0">◀</button>
<button data-dir="0,0">■</button>
<button data-dir="1,0">▶</button>
<span></span><button data-dir="0,1">▼</button><span></span>
</div>

<div id="actions">
<button id="select">HEDEF</button>
<button id="attack">⚔ SALDIR</button>
<button id="pot">HP / MP</button>
</div>

<script type="module">
import * as THREE from '/three/three.module.js';

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bb5c4);
scene.fog=new THREE.Fog(0x9bb5c4,45,110);

const camera=new THREE.PerspectiveCamera(
60,innerWidth/innerHeight,0.1,200);

const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x596044,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(20,40,15);
scene.add(sun);

function box(w,h,d,color,x,y,z){
const mesh=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({color}));
mesh.position.set(x,y,z);
scene.add(mesh);
return mesh;
}

box(80,0.4,80,0x65754a,0,-0.2,0);
box(80,0.05,7,0x9c9072,0,0.03,0);

for(let i=-38;i<=38;i+=4){
box(4,3,1,0x77776b,i,1.5,-40);
box(4,3,1,0x77776b,i,1.5,40);
box(1,3,4,0x77776b,-40,1.5,i);
box(1,3,4,0x77776b,40,1.5,i);
}

for(let i=0;i<24;i++){
const x=Math.sin(i*7.3)*35;
const z=Math.cos(i*4.7)*32;
if(Math.abs(z)<6)continue;
box(1,3,1,0x5a3822,x,1.5,z);
const tree=new THREE.Mesh(
new THREE.ConeGeometry(2.5,5,6),
new THREE.MeshStandardMaterial({color:0x294b28}));
tree.position.set(x,5,z);
scene.add(tree);
}

box(5,5,5,0x597b9c,-32,2.5,0);
box(5,5,5,0x9c594c,32,2.5,0);

const models=new Map();
let players=[],myId=null,target=null;

const ws=new WebSocket(
(location.protocol==='https:'?'wss://':'ws://')+location.host);

function send(data){
if(ws.readyState===1)ws.send(JSON.stringify(data));
}

ws.onopen=()=>$('message').textContent='Sunucu hazir';
ws.onclose=()=>{
$('message').textContent='Baglanti kesildi. Sayfayi yenile.';
$('login').style.display='flex';
};
ws.onerror=()=>$('message').textContent='Baglanti hatasi';

$('join').onclick=()=>{
if(ws.readyState!==1)return;
send({t:'join',name:$('nick').value,
team:$('team').value,c:$('cls').value});
};

function character(p){
const g=new THREE.Group();
const color=p.team==='Human'?0x3868c4:0xb83333;

function part(w,h,d,c,x,y,z){
const m=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({color:c}));
m.position.set(x,y,z);
g.add(m);
}
part(0.9,1,0.55,color,0,1.4,0);
part(0.5,0.5,0.5,0xbfc3c5,0,2.15,0);
part(0.3,0.9,0.35,0x777777,-0.25,0.45,0);
part(0.3,0.9,0.35,0x777777,0.25,0.45,0);
part(0.3,0.9,0.3,color,-0.65,1.4,0);
part(0.3,0.9,0.3,color,0.65,1.4,0);
part(0.15,1.5,0.15,0xd5d5d5,0.8,1.5,0.3);

const label=document.createElement('canvas');
label.width=256;label.height=64;
const ctx=label.getContext('2d');
ctx.font='bold 25px Arial';
ctx.textAlign='center';
ctx.fillStyle='white';
ctx.fillText(p.name,128,35);
const sprite=new THREE.Sprite(
new THREE.SpriteMaterial({
map:new THREE.CanvasTexture(label)
}));
sprite.scale.set(4,1,1);
sprite.position.y=3;
g.add(sprite);

scene.add(g);
return g;
}

ws.onmessage=e=>{
const m=JSON.parse(e.data);
if(m.t==='id'){
myId=m.id;
$('login').style.display='none';
}
if(m.t!=='state')return;
players=m.players;
$('status').textContent='Online: '+players.length;

for(const p of players){
if(!models.has(p.id))
models.set(p.id,character(p));
const g=models.get(p.id);
g.position.set(p.x,0,p.z);
g.visible=!p.dead;
if(p.dx||p.dz)
g.rotation.y=Math.atan2(p.dx,p.dz);
}
for(const [id,g] of models){
if(!players.some(p=>p.id===id)){
scene.remove(g);
models.delete(id);
}
}
const me=players.find(p=>p.id===myId);
if(me){
$('info').textContent=me.dead?'Yeniden doguyorsun...':
'Lv.65 '+me.c;
$('hp').style.width=(me.hp/me.max*100)+'%';
$('mp').style.width=(me.mp/me.mmax*100)+'%';
$('np').textContent='NP: '+me.np;
}
const enemy=players.find(p=>p.id===target&&!p.dead);
$('target').textContent=enemy?
enemy.name+' HP: '+enemy.hp:'Hedef: Yok';
};

function move(x,z){send({t:'move',x,z})}

document.querySelectorAll('[data-dir]').forEach(b=>{
b.onpointerdown=e=>{
b.setPointerCapture(e.pointerId);
const [x,z]=b.dataset.dir.split(',').map(Number);
move(x,z);
};
b.onpointerup=b.onpointercancel=()=>move(0,0);
});

$('select').onclick=()=>{
const me=players.find(p=>p.id===myId);
if(!me)return;
const enemies=players.filter(
p=>p.team!==me.team&&!p.dead);
enemies.sort((a,b)=>
Math.hypot(a.x-me.x,a.z-me.z)-
Math.hypot(b.x-me.x,b.z-me.z));
target=enemies[0]?.id||null;
};

$('attack').onclick=()=>{
if(!target)$('select').click();
if(target)send({t:'hit',id:target});
};
$('pot').onclick=()=>send({t:'pot'});

const keys=new Set();
function keyboardMove(){
move(Number(keys.has('d')||keys.has('arrowright'))-
Number(keys.has('a')||keys.has('arrowleft')),
Number(keys.has('s')||keys.has('arrowdown'))-
Number(keys.has('w')||keys.has('arrowup')));
}
addEventListener('keydown',e=>{
if($('login').style.display!=='none')return;
keys.add(e.key.toLowerCase());
keyboardMove();
if(e.code==='Space')$('attack').click();
});
addEventListener('keyup',e=>{
keys.delete(e.key.toLowerCase());
keyboardMove();
});
addEventListener('blur',()=>{keys.clear();move(0,0)});

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

camera.position.set(0,18,25);
function animate(){
requestAnimationFrame(animate);
const me=players.find(p=>p.id===myId);
if(me){
camera.position.lerp(
new THREE.Vector3(me.x,13,me.z+17),0.12);
camera.lookAt(me.x,1,me.z);
}else camera.lookAt(0,0,0);
renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
