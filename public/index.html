<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Classic PvP Alpha</title><style>*{box-sizing:border-box}body{margin:0;background:#101a16;color:#eee;font:14px Arial;overflow:hidden;touch-action:none}canvas{display:block}button,input,select{background:#292c25;color:#f5e3b4;border:1px solid #a38b53;border-radius:7px;padding:12px;font-size:15px}#login{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(#3c5144,#101a16);z-index:4}.panel{width:min(320px,90vw);padding:22px;border:1px solid #b69b61;background:#161e1b;text-align:center;border-radius:12px}.panel>*{width:100%;margin:5px 0}h1{color:#e9c77b}#hud{position:fixed;top:8px;left:8px;background:#101711dd;border:1px solid #a38b53;padding:10px;border-radius:8px;pointer-events:none;line-height:1.5}#actions{position:fixed;right:10px;bottom:15px;display:grid;grid-template-columns:repeat(2,85px);gap:6px}#joy{position:fixed;left:18px;bottom:22px;width:115px;height:115px;border:2px solid #b49b65;border-radius:50%;background:#1117;display:grid;place-items:center}#stick{width:42px;height:42px;border-radius:50%;background:#b49b65;pointer-events:none}#msg{position:fixed;top:12px;left:50%;transform:translateX(-50%);color:#ffdf89;text-shadow:1px 1px black;pointer-events:none}#full{position:fixed;right:8px;top:8px}#target{color:#ffb0a0}small{color:#b5b5a5}</style><body><div id="login"><div class="panel"><h1>CLASSIC PvP</h1><small>ALPHA • HUMAN vs ORC</small><input id="nick" placeholder="Hesap adi (ASCII)"><input id="pass" type="password" placeholder="Sifre (en az 6 karakter)"><select id="team"><option>Human</option><option>Orc</option></select><select id="cls"><option>Warrior</option><option>Archer</option><option>Mage</option><option>Assassin</option></select><button id="join">OYUNA GIR / KAYIT</button><div id="status">Yukleniyor...</div></div></div><div id="hud"></div><div id="msg"></div><button id="full">Tam ekran</button><div id="joy"><div id="stick"></div></div><div id="actions"><button id="select">Hedef</button><button id="hit">Saldir</button><button id="pot">HP pot</button><button id="upgrade">Upgrade</button><button id="shop">NP scroll</button><button id="reset">Kamera</button></div><script>window.addEventListener('error',e=>document.getElementById('status').textContent='Hata: '+e.message);window.addEventListener('unhandledrejection',e=>document.getElementById('status').textContent=String(e.reason));</script><script type="module">
import * as T from '/three/three.module.js';const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const scene=new T.Scene();scene.background=new T.Color(0x9aafbd);scene.fog=new T.Fog(0x9aafbd,35,95);const cam=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,120),r=new T.WebGLRenderer({antialias:false});r.setPixelRatio(Math.min(devicePixelRatio,1.4));r.setSize(innerWidth,innerHeight);document.body.prepend(r.domElement);scene.add(new T.HemisphereLight(0xffffff,0x596044,2));let sun=new T.DirectionalLight(0xffe4c0,2);sun.position.set(10,30,20);scene.add(sun);function mesh(geo,c,x,y,z,parent=scene){let m=new T.Mesh(geo,new T.MeshStandardMaterial({color:c}));m.position.set(x,y,z);parent.add(m);return m}function box(w,h,d,c,x,y,z,p){return mesh(new T.BoxGeometry(w,h,d),c,x,y,z,p)}function cyl(a,b,h,c,x,y,z,p){return mesh(new T.CylinderGeometry(a,b,h,8),c,x,y,z,p)}box(80,.4,80,0x64774b,0,-.2,0);for(let i=-38;i<=38;i+=4){box(4,.06,5,0x9a9380,i,.03,0);box(4,3,1,0x77776c,i,1.5,-40);box(4,3,1,0x77776c,i,1.5,40);box(1,3,4,0x77776c,-40,1.5,i);box(1,3,4,0x77776c,40,1.5,i)}for(let x of [-35,35])for(let z of [-7,7]){cyl(2,2.3,7,0x88877d,x,3.5,z);for(let i=0;i<8;i++)box(.7,1,.7,0xaaa89a,x+1.7*Math.cos(i*Math.PI/4),7,z+1.7*Math.sin(i*Math.PI/4))}for(let i=0;i<32;i++){let x=Math.sin(i*7.3)*35,z=Math.cos(i*4.7)*35;if(Math.abs(z)<6)continue;cyl(.2,.4,3,0x67462c,x,1.5,z);mesh(new T.ConeGeometry(2,4,7),0x365b33,x,4,z)}let id=null,players=[],mobs=[],target=null,models=new Map(),yaw=0,pitch=.48,zoom=9,ix=0,iz=0;const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host),send=o=>{if(ws.readyState===1)ws.send(JSON.stringify(o))};ws.onopen=()=>$('status').textContent='Sunucu hazir';ws.onclose=()=>{$('login').style.display='grid';$('status').textContent='Baglanti kesildi, yenile'};$('join').onclick=()=>send({t:'join',name:$('nick').value,pass:$('pass').value,team:$('team').value,c:$('cls').value});function model(p){let g=new T.Group(),b=new T.Group();g.add(b);let mob=p.id.startsWith('m'),color=mob?0x806c49:p.team==='Human'?0x456d9c:0x994539,steel=p.c==='Warrior'?0xbac4cc:color;let legs=[],arms=[];cyl(.36,.25,.75,steel,0,1.35,0,b);mesh(new T.SphereGeometry(.27,10,8),mob?color:p.team==='Orc'?0x829d57:0xd7aa89,0,2,0,b);for(let s of [-1,1]){let l=new T.Group();l.position.set(s*.19,.95,0);b.add(l);box(.25,.75,.28,steel,0,-.4,0,l);box(.28,.17,.43,0x38332b,0,-.83,.08,l);legs.push(l);let a=new T.Group();a.position.set(s*.48,1.65,0);b.add(a);mesh(new T.SphereGeometry(.22,8,6),steel,0,0,0,a);box(.23,.65,.25,steel,0,-.35,0,a);arms.push(a)}if(!mob){let a=arms[1];if(p.c==='Mage'){cyl(.05,.07,1.8,0x79512d,0,.05,.15,a);mesh(new T.OctahedronGeometry(.18),0x55bfff,0,1,.15,a)}else if(p.c==='Archer'){let pts=[];for(let i=0;i<=16;i++){let t=-Math.PI/2+i*Math.PI/16;pts.push(new T.Vector3(Math.cos(t)*.4,Math.sin(t)*.8,0))}mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),16,.05,5,false),0x9b6536,0,-.5,.2,a);cyl(.01,.01,1.6,0xeee2b9,0,-.5,.2,a)}else{for(let a of p.c==='Assassin'?arms:[arms[1]]){box(.12,p.c==='Assassin'?.65:1.4,.07,0xdce5ec,0,.05,.18,a);box(.35,.08,.1,0xc8a34c,0,-.5,.18,a)}}}let cv=document.createElement('canvas');cv.width=256;cv.height=64;let ctx=cv.getContext('2d'),tex=new T.CanvasTexture(cv),sp=new T.Sprite(new T.SpriteMaterial({map:tex}));sp.position.y=2.8;sp.scale.set(3.5,.85,1);g.add(sp);g.userData={legs,arms,ctx,tex,label:''};g.position.set(p.x,0,p.z);scene.add(g);return g}function notice(s){$('msg').textContent=s;clearTimeout(notice.timer);notice.timer=setTimeout(()=>$('msg').textContent='',2200)}ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.t==='notice'){if(!id)$('status').textContent=m.text;else notice(m.text)}if(m.t==='id'){id=m.id;$('login').style.display='none'}if(m.t!=='state')return;players=m.players;mobs=m.mobs;let all=[...players,...mobs];for(let p of all){if(!models.has(p.id))models.set(p.id,model(p));let g=models.get(p.id);g.visible=!p.dead;let label=p.name+' Lv.'+p.level;if(label!==g.userData.label){g.userData.label=label;let c=g.userData.ctx;c.clearRect(0,0,256,64);c.font='bold 24px Arial';c.textAlign='center';c.fillStyle='white';c.strokeStyle='black';c.lineWidth=4;c.strokeText(label,128,34);c.fillText(label,128,34);g.userData.tex.needsUpdate=true}}for(let [k,g] of models)if(!all.some(p=>p.id===k)){scene.remove(g);g.traverse(o=>{o.geometry?.dispose();o.material?.map?.dispose();o.material?.dispose()});models.delete(k)}let p=players.find(p=>p.id===id),q=all.find(p=>p.id===target&&!p.dead);if(!q)target=null;if(p)$('hud').textContent='';if(p){for(let line of [`Lv.${p.level} ${p.c}`,`HP ${p.hp}/${p.max}`,`EXP ${(100*p.exp/p.nextExp).toFixed(1)}%`,`NP ${p.np} | Harcanabilir ${p.wallet}`,`Gold ${p.gold} | Scroll ${p.scrolls}`,`Silah +${p.plus}`,Math.abs(p.x)>25?'Guvenli bolge':'Savas bolgesi',q?`${q.name} HP ${q.hp}`:'Hedef yok',`Online ${players.length}`]){let d=document.createElement('div');d.textContent=line;$('hud').append(d)}}};let jp=null;function joy(e){let b=$('joy').getBoundingClientRect(),x=e.clientX-b.left-b.width/2,z=e.clientY-b.top-b.height/2,n=Math.max(40,Math.hypot(x,z));ix=x/n;iz=z/n;$('stick').style.transform=`translate(${ix*40}px,${iz*40}px)`}$('joy').onpointerdown=e=>{jp=e.pointerId;$('joy').setPointerCapture(jp);joy(e)};$('joy').onpointermove=e=>{if(e.pointerId===jp)joy(e)};function stop(){jp=null;ix=iz=0;$('stick').style.transform=''};$('joy').onpointerup=$('joy').onpointercancel=$('joy').onlostpointercapture=stop;addEventListener('blur',stop);setInterval(()=>{if(id)send({t:'move',x:ix*Math.cos(yaw)+iz*Math.sin(yaw),z:-ix*Math.sin(yaw)+iz*Math.cos(yaw)})},50);let touches=new Map();function pinch(){let a=[...touches.values()];return a.length===2?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0}r.domElement.onpointerdown=e=>{r.domElement.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY})};r.domElement.onpointermove=e=>{let o=touches.get(e.pointerId);if(!o)return;let before=pinch();touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1){yaw-=(e.clientX-o.x)*.008;pitch=clamp(pitch+(e.clientY-o.y)*.006,.08,1.35)}else if(before&&pinch())zoom=clamp(zoom*before/pinch(),3.5,22)};r.domElement.onpointerup=r.domElement.onpointercancel=r.domElement.onlostpointercapture=e=>touches.delete(e.pointerId);$('select').onclick=()=>{let p=players.find(p=>p.id===id);if(!p)return;let a=[...mobs,...players.filter(q=>q.team!==p.team)].filter(q=>!q.dead);a.sort((a,b)=>Math.hypot(a.x-p.x,a.z-p.z)-Math.hypot(b.x-p.x,b.z-p.z));target=a[0]?.id};$('hit').onclick=()=>{if(!target)$('select').click();if(target)send({t:'hit',id:target})};for(let k of ['pot','upgrade','shop'])$(k).onclick=()=>send({t:k});$('reset').onclick=()=>{yaw=(models.get(id)?.rotation.y||0)+Math.PI;pitch=.48;zoom=9};$('full').onclick=async()=>{try{await document.documentElement.requestFullscreen();await screen.orientation.lock('landscape')}catch{}};addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});let clock=new T.Clock();function frame(){requestAnimationFrame(frame);let dt=Math.min(.1,clock.getDelta()),a=1-Math.exp(-15*dt);for(let p of [...players,...mobs]){let g=models.get(p.id);if(!g)continue;let dx=p.x-g.position.x,dz=p.z-g.position.z;if(Math.hypot(dx,dz)>10)g.position.set(p.x,0,p.z);else{g.position.x+=dx*a;g.position.z+=dz*a}let moving=Math.abs(p.dx||0)+Math.abs(p.dz||0)>.05;if(moving){let d=Math.atan2(p.dx,p.dz)-g.rotation.y;g.rotation.y+=Math.atan2(Math.sin(d),Math.cos(d))*a}let s=moving?Math.sin(performance.now()*.012)*.6:0;g.userData.legs[0].rotation.x=s;g.userData.legs[1].rotation.x=-s;g.userData.arms[0].rotation.x=-s*.5;g.userData.arms[1].rotation.x=s*.5}let p=models.get(id)?.position||new T.Vector3();cam.position.set(p.x+Math.sin(yaw)*Math.cos(pitch)*zoom,1.4+Math.sin(pitch)*zoom,p.z+Math.cos(yaw)*Math.cos(pitch)*zoom);cam.lookAt(p.x,1.4,p.z);r.render(scene,cam)}frame();
